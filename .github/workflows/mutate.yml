name: mutate

# The GitHub API does not return the run id it just started, so the client
# generates a UUID, passes it as request_id, and finds the run by this name.
run-name: "op-${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: UUID generated by the panel; the run is found by it afterwards
        required: true
        type: string
      payload:
        description: JSON string describing the operation
        required: true
        type: string

# Two mutations at once would race on `packwiz refresh` and on `git push`.
# Queue, never cancel: a cancelled run could leave the pack half-edited.
concurrency:
  group: pack-mutation
  cancel-in-progress: false

permissions:
  contents: write # the chained analyze job commits admin-data back

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: lndieGamer/MCKSP-Seventh-Season
          path: pack
          token: ${{ secrets.PACK_REPO_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git identity for the pack
        run: |
          git -C pack config user.name "mcksp-admin"
          git -C pack config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # request_id and payload go through the environment, never through the
      # shell command line: the payload is attacker-shaped JSON by definition.
      - name: Apply operation
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          PAYLOAD: ${{ inputs.payload }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          python mutate/mutate.py \
            --request-id "$REQUEST_ID" \
            --payload "$PAYLOAD" \
            --pack pack \
            --admin-data admin-data

      - name: Push to the pack
        run: git -C pack push

  # The pack changed, so the analysis is stale. Calling the workflow directly
  # avoids needing a PAT: a repository_dispatch signed with GITHUB_TOKEN would
  # not start a new run at all.
  analyze:
    needs: mutate
    # analyze chains into pages; a nested workflow cannot hold more rights
    # than the job that called it, so they have to be granted here too.
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/analyze.yml
    secrets: inherit
