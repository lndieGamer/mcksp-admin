name: analyze

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  workflow_call: # mutate.yml chains straight into this after pushing to the pack
  repository_dispatch:
    types: [pack-changed]

permissions:
  contents: write

concurrency:
  group: analyze
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # fetch-depth: 0 is load-bearing: date_added/date_updated come from git log.
      - uses: actions/checkout@v4
        with:
          repository: lndieGamer/MCKSP-Seventh-Season
          path: pack
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analyzer/requirements.txt

      - run: pip install -r analyzer/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s analyzer/tests

      - name: Analyze pack
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: python analyzer/main.py --pack pack --out admin-data

      - name: Commit admin-data
        run: |
          # Without errexit a failing fetch or reset below falls through to the
          # "nothing to commit" branch and the step goes green having pushed nothing.
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-data
          # generated_at always moves, so this commits once per run by design:
          # the commit history doubles as the "last analyzed" audit trail.
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "analyze: refresh admin-data"
          # Two ops dispatched seconds apart produce two analyze runs whose
          # checkouts each predate the other's push, and the loser is rejected
          # as non-fast-forward. admin-data is generated wholesale, so there is
          # nothing to merge: replay this run's output on top of the new main.
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected; replaying admin-data on top of origin/main (attempt $attempt)"
            git fetch origin main
            ours=$(git rev-parse HEAD)
            git reset --hard FETCH_HEAD
            git checkout "$ours" -- admin-data
            if git diff --cached --quiet; then
              echo "main already carries identical admin-data"
              exit 0
            fi
            git commit -m "analyze: refresh admin-data"
          done
          echo "::error::admin-data could not be pushed after 5 attempts"
          exit 1

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          pub = json.loads(pathlib.Path("admin-data/public.json").read_text("utf-8"))
          priv = json.loads(pathlib.Path("admin-data/private.json").read_text("utf-8"))
          errors = [f for f in priv["lint"] if f["level"] == "error"]
          print(f"## analyze\n")
          print(f"- mods: **{len(pub['mods'])}**, edges: **{len(pub['edges'])}**")
          print(f"- updates: **{len(priv['updates'])}** "
                f"({sum(1 for u in priv['updates'] if u['status'] == 'blocked')} blocked)")
          print(f"- lint errors: **{len(errors)}**, unparsed: **{len(priv['unparsed'])}**")
          for f in errors[:20]:
              print(f"  - `{f['slug']}` {f['code']}: {f['message']}")
          PY

  # The commit above was pushed with GITHUB_TOKEN, which never triggers a
  # workflow -- pages would otherwise sit on stale data until someone
  # remembered to press the button.
  pages:
    needs: analyze
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
